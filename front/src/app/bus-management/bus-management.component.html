<section class="bus-page">
  <div class="header-row">
    <div>
      <h1>Gestion des Bus</h1>
      <p>Ajout, modification et suppression dans une seule page.</p>
    </div>
    <button *ngIf="auth.canCreate()" (click)="openAddForm()">+ Ajouter Bus</button>
  </div>

  <div class="content-grid">
    <div class="list-card">
      <div class="search-row">
        <input [(ngModel)]="searchText" (input)="applyFilter()" type="text" placeholder="Recherche par id, designation, capacite ou trajet" />
      </div>

      <table>
        <thead>
          <tr>
            <th>Designation</th>
            <th>Capacite</th>
            <th>Trajet</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let bus of filteredBuses">
            <td>{{ bus.designation }}</td>
            <td>{{ bus.capacite }}</td>
            <td>{{ bus.traget?.libelle }}</td>
            <td class="actions">
              <button class="light" *ngIf="auth.isAdmin()" (click)="openEditForm(bus)">Modifier</button>
              <ng-container *ngIf="auth.canDelete() && bus.id">
                <button class="danger" *ngIf="pendingDeleteId !== bus.id" (click)="requestDelete(bus.id)">Supprimer</button>
                <div class="inline-confirm" *ngIf="pendingDeleteId === bus.id">
                  <button class="danger" (click)="deleteBus(bus.id)">Confirmer</button>
                  <button class="light" (click)="cancelDelete()">Annuler</button>
                </div>
              </ng-container>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <aside class="editor" [class.open]="showEditor" [attr.aria-hidden]="!showEditor">
      <div class="editor-head">
        <h2>{{ editMode ? 'Modifier Bus' : 'Ajouter Bus' }}</h2>
        <button class="light" (click)="closeEditor()">Fermer</button>
      </div>

      <form *ngIf="showEditor" (ngSubmit)="saveBus()">
        <label for="designation">Designation</label>
        <input id="designation" [(ngModel)]="currentBus.designation" name="designation" type="text" required />

        <label for="capacite">Capacite</label>
        <input id="capacite" [(ngModel)]="currentBus.capacite" name="capacite" type="number" min="1" required />

        <label for="trajet">Trajet</label>
        <select id="trajet" [(ngModel)]="selectedTragetId" name="trajet" required>
          <option value="">Selectionner</option>
          <option *ngFor="let traget of tragets" [value]="traget.id">{{ traget.libelle }}</option>
        </select>

        <button type="submit">{{ editMode ? 'Enregistrer' : 'Ajouter' }}</button>
      </form>
    </aside>
  </div>

  <div class="editor-backdrop" *ngIf="showEditor" (click)="closeEditor()"></div>
</section>
