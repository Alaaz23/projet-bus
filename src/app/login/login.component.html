<section class="login-page">
  <div class="login-panel">
    <h1>Bus Tracking</h1>
    <p>Connectez-vous pour acceder au dashboard.</p>

    <form (ngSubmit)="submit()">
      <label for="username">Matricule</label>
      <input id="username" [(ngModel)]="username" name="username" type="text" placeholder="Entrez votre matricule" required />

      <label for="password">Mot de passe</label>
      <input id="password" [(ngModel)]="password" name="password" type="password" placeholder="Entrez votre mot de passe" required />

      <button type="submit">Se connecter</button>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

  </div>
</section>
