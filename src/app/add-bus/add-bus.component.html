<section class="bus-page">
  <div class="header-row">
    <div>
      <h1>Ajouter un bus</h1>
      <p>Ajout simple et visible, sans decalage d'ecran.</p>
    </div>
  </div>

  <div class="form-card">
    <form (ngSubmit)="onSubmit()" method="post">
      <label for="designation">Designation</label>
      <input type="text" id="designation" [(ngModel)]="designation" name="designation" required />

      <label for="capacity">Capacite</label>
      <input type="number" id="capacity" [(ngModel)]="capacity" name="capacity" required min="1" />

      <label for="traget">Trajet</label>
      <select id="traget" [(ngModel)]="selectedTraget" name="targetSelect" required>
        <option value="" disabled>Selectionner un trajet</option>
        <option *ngFor="let target of tragetList" [value]="target.libelle">{{ target.libelle }}</option>
      </select>

      <button type="submit">Ajouter le bus</button>
    </form>
  </div>
</section>
