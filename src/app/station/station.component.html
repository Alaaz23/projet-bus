

<section class="p-4">
  <div class="p-fluid">
    <div class="p-d-flex p-jc-between p-ai-center p-mb-3">
      <h3>Gestion des Stations</h3>
      <button pButton type="button" label="Ajouter Station" icon="pi pi-plus" class="p-button-rounded p-button-success" (click)="openAddModal()"></button>
    </div>

    <div class="p-inputgroup p-mb-3">
      <span class="p-inputgroup-addon"><i class="pi pi-search"></i></span>
      <input #gb pInputText type="text" placeholder="Recherche globale" (input)="dt.filterGlobal(gb.value, 'contains')" />
    </div>

    <p-table #dt [value]="stations" [paginator]="true" [rows]="10" [globalFilterFields]="['libelle','traget.libelle']">
      <ng-template pTemplate="header">
        <tr>
          <th>ID</th>
          <th>Libelle</th>
          <th>Longitude</th>
          <th>Latitude</th>
          <th>Traget</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-station>
        <tr>
          <td>{{ station.id }}</td>
          <td>{{ station.libelle }}</td>
          <td>{{ station.longitude }}</td>
          <td>{{ station.latitude }}</td>
          <td>{{ station.traget?.libelle }}</td>
          <td>
            <button pButton type="button" icon="pi pi-pencil" class="p-button-rounded p-button-sm p-button-info p-mr-2" (click)="openEditModal(station)"></button>
            <button pButton type="button" icon="pi pi-trash" class="p-button-rounded p-button-sm p-button-danger" (click)="deleteStation(station.id!)"></button>
          </td>
        </tr>
      </ng-template>
    </p-table>

    <p-dialog header="{{ editMode ? 'Modifier Station' : 'Ajouter Station' }}" [(visible)]="showDialog" [modal]="true" [closable]="true" [style]="{width: '420px'}">
      <form (ngSubmit)="saveStation()" class="p-fluid">
        <div class="p-field">
          <label for="libelle">Libelle</label>
          <input id="libelle" pInputText type="text" [(ngModel)]="currentStation.libelle" name="libelle" required />
        </div>
        <div class="p-field">
          <label for="longitude">Longitude</label>
          <input id="longitude" pInputText type="number" step="0.000001" [(ngModel)]="currentStation.longitude" name="longitude" required />
        </div>
        <div class="p-field">
          <label for="latitude">Latitude</label>
          <input id="latitude" pInputText type="number" step="0.000001" [(ngModel)]="currentStation.latitude" name="latitude" required />
        </div>
        <div class="p-field">
          <label for="traget">Traget</label>
          <p-dropdown [options]="tragets" optionLabel="libelle" [(ngModel)]="currentStation.traget" name="traget" placeholder="Sélectionner"></p-dropdown>
        </div>
        <div class="p-d-flex p-jc-end p-mt-3">
          <button pButton type="button" label="Annuler" class="p-button-text p-mr-2" (click)="showDialog=false"></button>
          <button pButton type="submit" label="{{ editMode ? 'Enregistrer' : 'Ajouter' }}" class="p-button-rounded p-button-primary"></button>
        </div>
      </form>
    </p-dialog>
  </div>
</section>

<p-confirmDialog></p-confirmDialog>
