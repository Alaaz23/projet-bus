<div class="app-shell" [class.collapsed]="isSidebarCollapsed">
  <aside class="sidebar">
    <a routerLink="/home" class="brand">
      <img src="assets/ss.png" alt="logo" />
      <span>Bus Tracking</span>
    </a>

    <nav class="menu">
      <a routerLink="/home" routerLinkActive="active">Dashboard</a>
      <a routerLink="/salaries" routerLinkActive="active">{{ auth.isAdmin() ? 'Salariés' : 'Mon Profil' }}</a>
      <a routerLink="/stations" routerLinkActive="active">Stations</a>
      <a routerLink="/tragets" routerLinkActive="active">Trajets</a>
      <a routerLink="/map" routerLinkActive="active">Carte</a>

      <div class="menu-group" *ngIf="canManage()">
        <p>Buss</p>
        <a routerLink="/buss" routerLinkActive="active">Gestion des bus</a>
      </div>

      <a routerLink="/feedbacks" routerLinkActive="active" *ngIf="canManage()">Feedbacks</a>

      <div class="menu-group" *ngIf="canManage()">
        <p>Analytics</p>
        <a routerLink="/dashboard" routerLinkActive="active">📊 Dashboard Stats</a>
        <a routerLink="/trajets-history" routerLinkActive="active">📜 Historique Trajets</a>
      </div>
    </nav>
  </aside>

  <section class="content">
    <header class="topbar">
      <button class="menu-toggle" (click)="toggleSidebar()">☰</button>

      <div class="topbar-meta">
        <app-notification-bell *ngIf="canManage()"></app-notification-bell>
        <span class="role">Role: {{ roleLabel }}</span>
        <strong>{{ auth.currentUser?.displayName }}</strong>
        <button class="logout" (click)="logout()">Logout</button>
      </div>
    </header>

    <main class="page-body">
      <router-outlet></router-outlet>
    </main>
  </section>
</div>
